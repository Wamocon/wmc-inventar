<title>WMC Inventar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Gestaltungsplan
   Farbe (WAMOCON-CI): Fläche #FFFFFF, Text #140B0B, Sekundär #5F3E3E, Signalrot #F40E0E nur für Kanten, Etikett und Balken,
   Rot als Text #B90808, Rahmen #D2C7C7 / #956D6D, Hinweisfläche #FEEBEB. Statusfarben nur für Status, immer mit Symbol und Text.
   Schrift: Archivo in zwei Breiten. Schmal (75 %) für Überschriften, Inventarnummern und Zahlen, angelehnt an das intern
   gelebte Arial Narrow; normale Breite für Text und Bedienung. Keine Großbuchstaben-Labels, keine Monospace-Schrift.
   Layout: Inventarbuch. Linksbündig, Abschnitte mit kräftiger Kopflinie statt Karten, Tabellen als Register mit feinen Zeilenlinien.
   Das eine auffällige Element ist das Inventaretikett (QR, Nummer, rote Oberkante): Es führt die Gerätedetailseite an,
   ist das Markenzeichen in der Kopfzeile und erscheint im Etikettendruck und bei „Meine Geräte“. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FAF6F6; --hint:#FEEBEB;
  --paper:#FFFFFF; --ink:#140B0B; --paper-line:#C9BDBD; --paper-muted:#5F3E3E;
  --fg:#140B0B; --fg-2:#5F3E3E; --fg-3:#8C7474;
  --signal:#F40E0E; --red:#B90808; --btn:#B90808; --btn-hover:#960606; --on-btn:#FFFFFF;
  --line:#D2C7C7; --line-2:#ECE5E5; --control:#956D6D;
  --ok:#0A6E37; --ok-bg:#E6F2EB; --warn:#96600A; --warn-bg:#FAF0DF; --info:#0B5FBF; --info-bg:#E7EFFA;
  --err:#7B0606; --err-bg:#F8E4E4; --neutral:#5F3E3E; --neutral-bg:#F2ECEC;
  --scrim:rgba(20,11,11,.45); --shadow:0 12px 32px rgba(20,11,11,.18);
  --font-ui:'Archivo','Helvetica Neue',Arial,sans-serif;
  --font-cond:'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --narrow:75%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#130C0C; --surface:#1B1313; --surface-2:#221818; --hint:#3A1818;
    --paper:#F5F1F1; --ink:#140B0B; --paper-line:#BBAEAE; --paper-muted:#5F3E3E;
    --fg:#F7EFEF; --fg-2:#CDB6B6; --fg-3:#9C8484;
    --signal:#F40E0E; --red:#FF8080; --btn:#C81111; --btn-hover:#E01C1C; --on-btn:#FFFFFF;
    --line:#40302F; --line-2:#2D2121; --control:#8E6E6E;
    --ok:#66D29A; --ok-bg:#11301F; --warn:#E8B45A; --warn-bg:#33270F; --info:#7DB8F8; --info-bg:#102439;
    --err:#FF9A9A; --err-bg:#3E1515; --neutral:#CDB6B6; --neutral-bg:#2B2020;
    --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#130C0C; --surface:#1B1313; --surface-2:#221818; --hint:#3A1818;
  --paper:#F5F1F1; --ink:#140B0B; --paper-line:#BBAEAE; --paper-muted:#5F3E3E;
  --fg:#F7EFEF; --fg-2:#CDB6B6; --fg-3:#9C8484;
  --signal:#F40E0E; --red:#FF8080; --btn:#C81111; --btn-hover:#E01C1C; --on-btn:#FFFFFF;
  --line:#40302F; --line-2:#2D2121; --control:#8E6E6E;
  --ok:#66D29A; --ok-bg:#11301F; --warn:#E8B45A; --warn-bg:#33270F; --info:#7DB8F8; --info-bg:#102439;
  --err:#FF9A9A; --err-bg:#3E1515; --neutral:#CDB6B6; --neutral-bg:#2B2020;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-cond);font-stretch:var(--narrow);font-size:32px;font-weight:750;letter-spacing:-0.02em;line-height:1.1}
h2{font-family:var(--font-cond);font-stretch:var(--narrow);font-size:19px;font-weight:700;letter-spacing:-0.01em;line-height:1.2}
h3{font-size:14px;font-weight:650}
p{margin:0}
a{color:var(--red)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono,.inv{font-family:var(--font-cond);font-stretch:var(--narrow);font-variant-numeric:tabular-nums;letter-spacing:0.01em}
.mono{font-size:14px}
.inv{font-size:15px;font-weight:700;white-space:nowrap}
.muted{color:var(--fg-2)}
.small{font-size:12.5px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Prototyp-Leiste: gehört nicht zum Tool */
.proto{background:var(--hint);color:var(--fg);font-size:12.5px}
.proto-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;padding-block:6px}
.proto b{font-weight:700}
.proto label{display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:12.5px}
.proto select{font:500 12.5px var(--font-ui);padding:2px 6px;min-height:0;width:auto;border:1px solid var(--control);border-radius:4px;background:var(--surface);color:var(--fg)}

/* Kopfzeile */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:4px solid var(--signal)}
.top-in{display:flex;align-items:center;gap:12px 24px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer;color:var(--fg);font-size:15px;font-weight:600}
.brand-tag{display:inline-block;font-family:var(--font-cond);font-stretch:var(--narrow);font-weight:800;font-size:15px;letter-spacing:0.02em;line-height:1;padding:5px 7px 4px;border:1px solid var(--line);border-top:3px solid var(--signal);border-radius:3px;background:var(--paper);color:var(--ink)}
.search{position:relative;flex:1;min-width:200px;max-width:440px}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg-2);width:16px;height:16px}
.search input{width:100%;height:36px;border:1px solid var(--control);border-radius:4px;padding:0 10px 0 34px;background:var(--surface);color:var(--fg);font:14px var(--font-ui)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;z-index:35}
.results button{display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer}
.results button .ic{align-self:center}
.results button:hover,.results button:focus-visible{background:var(--surface-2)}
.results .empty{padding:10px 12px;color:var(--fg-2)}
.user{display:flex;align-items:center;gap:12px;margin-left:auto;white-space:nowrap}
.user .who{display:flex;flex-direction:column;line-height:1.25;text-align:right}
.user .who small{color:var(--fg-2);font-size:12px}

/* Shell */
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;align-items:start}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:1px;padding-block:28px}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 12px;border:0;border-radius:0;background:none;cursor:pointer;text-align:left;color:var(--fg);font-weight:500;white-space:nowrap;box-shadow:inset 2px 0 0 var(--line-2)}
.nav-item .ic{color:var(--fg-2);width:17px;height:17px}
.nav-item:hover{color:var(--red)}
.nav-item[aria-current="page"]{color:var(--red);font-weight:700;box-shadow:inset 3px 0 0 var(--signal)}
.nav-item[aria-current="page"] .ic{color:var(--red)}
.nav-item .count{margin-left:auto;font-size:12px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.nav-sep{height:14px}
main{padding-block:28px 72px;min-width:0;display:flex;flex-direction:column;gap:28px}

/* Kopf einer Seite */
.page-head{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between}
.page-head .lead{color:var(--fg-2);margin-top:6px;max-width:68ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--fg-2);font-weight:500;background:none;border:0;padding:0;cursor:pointer;align-self:flex-start;margin-bottom:-14px}
.back:hover{color:var(--red)}
.back .ic{width:16px;height:16px}

/* Bedienelemente */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--control);background:var(--surface);color:var(--fg);font:500 14px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap}
.btn .ic{width:16px;height:16px}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--on-btn);font-weight:600}
.btn.primary:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn.primary:focus-visible{outline-color:var(--fg)}
.btn.quiet-danger{color:var(--err);border-color:transparent;background:none}
.btn.quiet-danger:hover{border-color:var(--err)}
.btn.link{border-color:transparent;background:none;color:var(--red);padding:0 4px;min-height:28px}
.btn.link:hover{text-decoration:underline}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.chip .n{color:var(--fg-2);font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--control)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:var(--bg);opacity:.75}
.chip .ic{width:14px;height:14px}
label{font-size:13px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.req::after{content:" *";color:var(--red)}
input,select,textarea{font:14px/1.4 var(--font-ui);color:var(--fg);background:var(--surface);border:1px solid var(--control);border-radius:4px;padding:8px 10px;min-height:38px;width:100%}
textarea{min-height:76px;resize:vertical}
input[type=checkbox],input[type=radio]{width:16px;height:16px;min-height:0;accent-color:var(--btn);margin:0;flex:none}
[aria-invalid="true"]{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.help{font-size:12.5px;color:var(--fg-2);font-weight:400}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:500;cursor:pointer}
.check input{margin-top:2px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.toolbar select{width:auto;min-width:160px}

/* Status */
.pill{display:inline-flex;align-items:center;gap:5px;min-height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1}
.pill .ic{width:14px;height:14px}
.pill.ok{color:var(--ok);background:var(--ok-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.info{color:var(--info);background:var(--info-bg)}
.pill.err{color:var(--err);background:var(--err-bg)}
.pill.neutral{color:var(--neutral);background:var(--neutral-bg)}
.pill.muted{color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line);background:transparent}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* Abschnitte im Inventarbuch: Kopflinie statt Kasten */
.card{min-width:0;display:flex;flex-direction:column}
.card-head{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:2px solid var(--fg)}
.card-head > .muted{font-size:13px}
.card-head .count{font-family:var(--font-cond);font-stretch:var(--narrow);font-weight:700;font-size:19px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.card-body{padding-top:16px;display:flex;flex-direction:column;gap:14px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--fg-2);padding:8px 12px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line-2);vertical-align:middle}
th:last-child,td:last-child{padding-right:0}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--surface-2)}
td.nowrap,th.nowrap{white-space:nowrap}
td.r,th.r{text-align:right}
td .sub{display:block;font-size:12.5px;color:var(--fg-2)}
.linkish{background:none;border:0;padding:0;color:var(--red);font-weight:600;cursor:pointer;text-align:left}
.linkish.inv{color:var(--fg)}
.linkish:hover{text-decoration:underline;color:var(--red)}
.empty-state{padding:28px 0;color:var(--fg-2)}
.bulk{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 8px 8px 14px;background:var(--fg);color:var(--bg);border-radius:4px}
.bulk .btn{background:transparent;color:var(--bg);border-color:var(--bg)}
.bulk .btn:hover{background:var(--bg);color:var(--fg)}
dl.kv{display:grid;grid-template-columns:minmax(120px,34%) minmax(0,1fr);margin:0}
dl.kv dt,dl.kv dd{padding:8px 0;border-bottom:1px solid var(--line-2)}
dl.kv dt{color:var(--fg-2);font-size:13px;padding-right:12px}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* Übersicht */
.stock{display:flex;flex-direction:column;gap:10px}
.stock-bar{display:flex;height:30px;gap:3px}
.stock-bar span{display:block;height:100%;border-radius:2px;min-width:4px}
.stock-legend{display:flex;flex-wrap:wrap;gap:8px 32px;list-style:none;margin:0;padding:0}
.stock-legend li{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--fg-2)}
.stock-legend i{width:10px;height:10px;border-radius:2px;display:inline-block;align-self:center}
.stock-legend b{font-family:var(--font-cond);font-stretch:var(--narrow);font-size:22px;font-weight:750;color:var(--fg);font-variant-numeric:tabular-nums}
.stock-meta{display:flex;flex-wrap:wrap;gap:4px 28px;font-size:13px;color:var(--fg-2)}
.stock-meta b{color:var(--fg);font-weight:650;font-variant-numeric:tabular-nums}
.dash{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:28px 48px;align-items:start}
.ledger{list-style:none;margin:0;padding:0}
.ledger li{border-bottom:1px solid var(--line-2)}
.ledger button{display:grid;grid-template-columns:minmax(0,1fr) auto 52px;align-items:center;gap:12px;width:100%;padding:10px 0;border:0;background:none;text-align:left;cursor:pointer}
.ledger button:hover .k-name{color:var(--red)}
.ledger .k-name{display:flex;flex-direction:column;font-weight:600;line-height:1.3}
.ledger .k-name small{font-weight:400;color:var(--fg-2);font-size:12.5px}
.ledger .k-name .ic{width:15px;height:15px;color:var(--err);vertical-align:-2px;margin-right:4px}
.ledger .k-val{font-family:var(--font-cond);font-stretch:var(--narrow);font-weight:750;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ledger .k-val small{font-size:16px;font-weight:500;color:var(--fg-2)}
.ledger .attn .k-val{color:var(--err)}
.ledger .delta{text-align:right;font-size:13px}
.delta{font-weight:700;font-variant-numeric:tabular-nums}
.delta.good{color:var(--ok)} .delta.bad{color:var(--err)} .delta.flat{color:var(--fg-2)}
.ledger-note{font-size:12.5px;color:var(--fg-2);margin-top:8px}
.todo{display:flex;flex-direction:column;gap:28px;min-width:0}
.worklist{list-style:none;margin:0;padding:0}
.worklist li{display:flex;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.worklist .what{display:flex;flex-direction:column;min-width:0}
.worklist .what small{color:var(--fg-2);font-size:12.5px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 40px;align-items:start}

/* Etikett: das markante Element */
.tag{display:inline-grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:14px 22px 14px 14px;border:1px solid var(--line);border-top:5px solid var(--signal);border-radius:6px;background:var(--paper);color:var(--ink);max-width:100%}
.tag .qr{width:92px;height:92px;flex:none}
.tag .qr svg{width:100%;height:100%;display:block}
.tag-text{display:flex;flex-direction:column;gap:4px;min-width:0}
.tag-nr{font-family:var(--font-cond);font-stretch:var(--narrow);font-weight:800;font-size:46px;line-height:.95;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
.tag-model{font-size:14px;font-weight:600}
.tag-own{font-size:12px;color:var(--paper-muted)}
.detail-head{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end}
.detail-meta{display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
.detail-meta p{color:var(--fg-2)}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px 48px;align-items:start}
.stack{display:flex;flex-direction:column;gap:28px;min-width:0}
.timeline{list-style:none;margin:0;padding:6px 0 0}
.timeline li{position:relative;padding:8px 0 12px 20px;border-left:1px solid var(--line);margin-left:5px}
.timeline li::before{content:"";position:absolute;left:-5px;top:14px;width:9px;height:9px;border-radius:2px;background:var(--surface);border:2px solid var(--control)}
.timeline li:first-child::before{border-color:var(--signal);background:var(--signal)}
.timeline .t{font-weight:650}
.timeline .d{font-size:12.5px;color:var(--fg-2);font-variant-numeric:tabular-nums;margin-left:6px}
.timeline p{font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.attach{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.attach .ic{color:var(--fg-2)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:4px;background:var(--hint);font-size:13.5px}
.notice .ic{color:var(--red);margin-top:1px}
.notice.warn{background:var(--warn-bg)} .notice.warn .ic{color:var(--warn)}
.notice.err{background:var(--err-bg)} .notice.err .ic{color:var(--err)}
.notice.info{background:var(--info-bg)} .notice.info .ic{color:var(--info)}

/* Dialog */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-top:4px solid var(--signal);border-radius:8px;box-shadow:var(--shadow);width:min(640px,100%);margin:auto 0}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 12px}
.modal-head .x{border:0;background:none;cursor:pointer;color:var(--fg-2);padding:4px;border-radius:4px}
.modal-body{padding:4px 22px 18px;display:flex;flex-direction:column;gap:16px}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line-2)}
.dev-list{display:flex;flex-direction:column}
.dev-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.dev-row .what{display:flex;flex-direction:column;min-width:0}
.dev-row .what small{color:var(--fg-2);font-size:12.5px}
.dev-row select{width:auto;min-width:220px}
.sig{position:relative;height:150px;border:1px solid var(--control);border-radius:4px;background:var(--paper);color:var(--ink);overflow:hidden}

    verliehen:{v:act.filter(d => d.status === 'verliehen').length, t:poolAct.length},
    overdue:{v:out.filter(overdue).length, t:out.length},
    anfragen:{v:LOANS.filter(l => l.status === 'angefragt').length},

}

/* ---------- QR ---------- */
function qrSvg(text){
  try{
    if(typeof qrcode === 'function'){
      const q = qrcode(0, 'M'); q.addData(text); q.make();
      const n = q.getModuleCount(); let p = '';
      for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) p += `M${c} ${r}h1v1h-1z`;
      return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR-Code ${esc(text)}"><path d="${p}" fill="currentColor"/></svg>`;
    }
  }catch(e){}
  let h = 0; for(const ch of text) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  let p = ''; const n = 21;
  const finder = (x, y) => `M${x} ${y}h7v7h-7zM${x+1} ${y+1}v5h5v-5zM${x+2} ${y+2}h3v3h-3z`;
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){ if((r<8&&c<8)||(r<8&&c>12)||(r>12&&c<8)) continue; h = (h * 1103515245 + 12345) >>> 0; if(h & 0x400) p += `M${c} ${r}h1v1h-1z`; }
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR-Code ${esc(text)}"><path d="${finder(0,0)}${finder(14,0)}${finder(0,14)}" fill="currentColor" fill-rule="evenodd"/><path d="${p}" fill="currentColor"/></svg>`;
}

/* ---------- Geräte ---------- */
function filtered(){
  const f = S.f; let L = D.slice();
  if(f.status === 'aktiv') L = L.filter(d => d.status !== 'ausgemustert');
  else if(f.status === 'archiv') L = L.filter(d => d.status === 'ausgemustert');
  else L = L.filter(d => d.status === f.status);
  if(f.cat) L = L.filter(d => d.cat === f.cat);
  if(f.ort === 'lager') L = L.filter(d => isLager(d.ort)); else if(f.ort === 'ap') L = L.filter(d => d.ort && !isLager(d.ort)); else if(f.ort === 'person') L = L.filter(d => d.person);
  if(f.pool) L = L.filter(d => d.pool);
  if(f.special === 'garantie') L = L.filter(garantieBald);
  if(f.special === 'luecken') L = L.filter(d => gaps(d).length);
  if(f.q){ const q = f.q.toLowerCase(); L = L.filter(d => [d.nr, d.sn, d.maker, d.model, d.host, d.alt, pname(d.person), catName(d.cat), d.ort || ''].join(' ').toLowerCase().includes(q)); }
  return L;
}

    <tbody>${L.length ? L.map(d => `<tr class="rowlink" data-go="geraet:${d.nr}">

      <td><button class="linkish inv" data-go="geraet:${d.nr}">${d.nr}</button></td>

/* ---------- Gerätedetail ---------- */
function actionsFor(d){
  const b = (act, label, ic, cls = '') => `<button class="btn ${cls}" data-act="${act}" data-arg="${d.nr}">${icon(ic)}${label}</button>`;
  const edit = b('bearbeiten','Bearbeiten','pen'), lab = b('etikett','Etikett','qr');
  switch(d.status){
    case 'lager': return b('ausgabe','Ausgeben','usercheck','primary') + b('verleih','Verleihen','swap') + b('reparatur','Reparatur','wrench') + edit + lab + b('ausmustern','Ausmustern','archive','quiet-danger');
    case 'benutzung': return b('rueckgabe','Zurücknehmen','box','primary') + (d.ort && !isLager(d.ort) ? b('umzug','Umzug','move') : '') + b('reparatur','Reparatur','wrench') + edit + lab + b('ausmustern','Verlust melden','alert','quiet-danger');
    case 'verliehen': return b('rueckgabe','Rücknahme','box','primary') + b('verlaengern','Verlängern','clock') + edit + lab + b('ausmustern','Verlust melden','alert','quiet-danger');
    case 'reparatur': return b('repende','Reparatur abschließen','check','primary') + edit + lab + b('ausmustern','Ausmustern','archive','quiet-danger');
  }
  return '';
}
function protoFor(d){ return PROTOS.filter(p => p.geraete.includes(d.nr)).slice(-1)[0]; }
function protoChip(p){ return p ? `<span class="pills"><button class="btn link" data-act="pdf" data-arg="${p.nr}">${icon('file')}${p.nr} (PDF)</button>${p.offen ? `<span class="pill warn">${icon('pen')}${PST[p.st]}</span>` : ''}</span>` : '<span class="muted">Altbestand ohne Protokoll</span>'; }
function protoActions(x, admin){
  const pend = x.st === 'wartet' ? (admin ? `<button class="btn sm" data-act="gz-tablet" data-arg="${x.nr}">${icon('pen')}Am Tablet gegenzeichnen</button><button class="btn sm" data-act="resend" data-arg="${x.nr}">${icon('mail')}Link erneut senden</button>` : '')
    : x.st === 'papier' && admin ? `<button class="btn sm" data-act="scan" data-arg="${x.nr}">${icon('upload')}Scan hochladen</button>` : '';
  return `<span class="actions">${x.offen ? `<span class="pill warn">${icon('pen')}${PST[x.st]}</span>` : `<span class="pill ok">${icon('check')}signiert, versiegelt</span>`}${pend}<button class="btn sm" data-act="pdf" data-arg="${x.nr}">${icon('file')}PDF</button></span>`;
}

/* ---------- Dialoge ---------- */
let dlgCleanup = null;
function openDialog(title, body, foot, onMount, sub = '', wide = false){
  const root = document.getElementById('dlg');
  root.innerHTML = `<div class="backdrop" data-backdrop><div class="modal${wide ? ' wide' : ''}${S.retro && S.view === 'arbeitsplaetze' ? ' pixel' : ''}" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div class="modal-head"><div><h2 id="dlg-title">${title}</h2>${sub ? `<p class="muted small" style="margin-top:2px">${sub}</p>` : ''}</div><button class="x" data-close aria-label="Schließen">${icon('x')}</button></div>
    <form id="dlg-form" novalidate><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></form></div></div>`;
  const back = root.querySelector('[data-backdrop]');
  back.addEventListener('mousedown', e => { if(e.target === back) closeDialog(); });
  root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); closeDialog(); }));
  const onKey = e => { if(e.key === 'Escape') closeDialog(); };
  document.addEventListener('keydown', onKey);
  dlgCleanup = () => document.removeEventListener('keydown', onKey);
  if(onMount) onMount(root.querySelector('#dlg-form'));
  const first = root.querySelector('.modal-body input:not([type=hidden]):not([readonly]), .modal-body select, .modal-body textarea');
  (first || root.querySelector('.modal')).focus?.();
}
function closeDialog(){ const r = document.getElementById('dlg'); if(r) r.innerHTML = ''; if(dlgCleanup){ dlgCleanup(); dlgCleanup = null; } }
const footBtns = (label, primary = true) => `<button type="button" class="btn" data-close>Abbrechen</button><button type="submit" class="btn ${primary ? 'primary' : 'quiet-danger'}">${label}</button>`;
function showErrors(form, list){
  const box = form.querySelector('[data-errors]');
  box.innerHTML = list.length ? `<div class="notice err">${icon('alert')}<span>${list.map(esc).join('<br>')}</span></div>` : '';
  return list.length === 0;
}

function toast(msg, action){
  const box = document.getElementById('toasts'), el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = `${icon('checkc')}<span>${esc(msg)}</span>`;
  if(action){ const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label; b.addEventListener('click', () => { el.remove(); action.fn(); }); el.appendChild(b); }
  box.appendChild(el); setTimeout(() => el.remove(), action ? 7000 : 4500);
}

  };
  ['#e-cat','#e-multi','#e-sns'].forEach(s => $(s).addEventListener('input', upd)); $('#e-cat').addEventListener('change', upd); upd();
  f.addEventListener('submit', e => {
    e.preventDefault();
    const cat = $('#e-cat').value, maker = $('#e-maker').value.trim(), model = $('#e-model').value.trim(), multi = $('#e-multi').checked;
    const sns = multi ? lines() : [$('#e-sn').value.trim()];
    const errs = [];
    [['#e-cat', cat, 'Bitte eine Kategorie wählen.'], ['#e-maker', maker, 'Bitte den Hersteller angeben.'], ['#e-model', model, 'Bitte das Modell angeben.']].forEach(([s, v, m]) => { $(s).setAttribute('aria-invalid', !v); if(!v) errs.push(m); });
    if(multi && sns.length < 2) errs.push('Für die Mehrfacherfassung bitte mindestens zwei Seriennummern eintragen, eine pro Zeile.');
    if(cat && CATS[cat].sn && sns.some(s => !s)) errs.push(`Für ${CATS[cat].name} ist die Seriennummer Pflicht.`);
    const dupFile = sns.filter((s, i) => s && sns.indexOf(s) !== i); if(dupFile.length) errs.push(`Seriennummer ${dupFile[0]} steht doppelt in der Liste.`);
    sns.forEach(s => { const ex = s && D.find(d => d.sn === s && d.maker.toLowerCase() === maker.toLowerCase()); if(ex) errs.push(`Seriennummer ${s} ist bei ${ex.maker} schon als ${ex.nr} erfasst.`); });
    document.getElementById('e-errors').innerHTML = errs.length ? `<div class="notice err">${icon('alert')}<span>${errs.map(esc).join('<br>')}</span></div>` : '';
    if(errs.length){ document.getElementById('e-errors').scrollIntoView({block:'center'}); return; }
    const created = sns.map(sn => { seq++; const kauf = $('#e-kauf').value || TODAY;
      const d = {nr:'WMC-' + String(seq).padStart(5, '0'), cat, maker, model, sn, status:'lager', zustand:Number($('#e-zustand').value), pool:$('#e-pool').checked, person:null, ort:$('#e-ort').value,
        host:$('#e-host').value.trim(), tech:$('#e-tech').value.trim(), kauf, preis:parseFloat($('#e-preis').value) || 0, lieferant:$('#e-lief').value.trim(), rechnung:$('#e-rech').value.trim(),
        garantie:$('#e-gar').value || addMonths(kauf, 24), notiz:$('#e-notiz').value.trim(), att:$('#e-file').files[0] ? [$('#e-file').files[0].name] : [],
        hist:[{d:TODAY, t:'Aufnahme', by:me().user, x:'Neugerät erfasst' + (sns.length > 1 ? ` (Mehrfacherfassung, ${sns.length} Geräte)` : '')}]};
      D.push(d); return d.nr; });
    if(mode === 'label'){ S.labels = created; go('etiketten'); toast(`${created.length} Gerät${created.length > 1 ? 'e' : ''} angelegt: ${created.join(', ')}.`); }
    else { go('geraet', created[0]); toast(`${created.length} Gerät${created.length > 1 ? 'e' : ''} angelegt: ${created.join(', ')}.`, {label:'Etikett drucken', fn:() => { S.labels = created; go('etiketten'); }}); }
  });
}
function bindAnfrage(){
  const f = document.getElementById('form-anfrage'), $ = s => f.querySelector(s);
  const upd = () => { const c = $('#a-cat').value, von = $('#a-von').value, bis = $('#a-bis').value;
    if(!von || !bis || bis < von){ $('#a-avail').innerHTML = ''; return; }
    const free = poolFree(c, von, bis).length, all = D.filter(d => d.pool && d.cat === c && d.status !== 'ausgemustert').length;
    $('#a-avail').innerHTML = free ? `<div class="notice info">${icon('info')}<span>Im Zeitraum sind ${free} von ${all} Leihgeräten der Kategorie ${catName(c)} frei.</span></div>`
      : `<div class="notice warn">${icon('alert')}<span>Im Zeitraum ist kein Leihgerät der Kategorie ${catName(c)} frei. Sie können trotzdem anfragen, die IT meldet sich.</span></div>`; };
  ['#a-cat','#a-von','#a-bis'].forEach(s => $(s).addEventListener('change', upd)); upd();
  f.addEventListener('submit', e => { e.preventDefault();
    const c = $('#a-cat').value, von = $('#a-von').value, bis = $('#a-bis').value, zweck = $('#a-zweck').value.trim(), errs = [];
    if(!von || von < TODAY) errs.push('Das Startdatum darf nicht in der Vergangenheit liegen.');
    if(!bis || bis < von) errs.push('Das Enddatum muss am oder nach dem Startdatum liegen.');
    $('#a-zweck').setAttribute('aria-invalid', !zweck); if(!zweck) errs.push('Bitte den Zweck angeben.');
    $('#a-errors').innerHTML = errs.length ? `<div class="notice err">${icon('alert')}<span>${errs.map(esc).join('<br>')}</span></div>` : '';
    if(errs.length) return;
    loanSeq++; LOANS.push({id:'L-' + String(loanSeq).padStart(4, '0'), person:me().pid, cat:c, nr:null, von, bis, zweck, status:'angefragt', am:TODAY});
    go('meineleihen'); toast('Anfrage gesendet. Die IT entscheidet und meldet sich per E-Mail.'); });
}
