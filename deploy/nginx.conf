# WMC Inventar: HTTPS mit internem Zertifikat vor der Anwendung (N-01).
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/tls/zertifikat.pem;
    ssl_certificate_key /etc/nginx/tls/schluessel.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # N-02: Uploads bis 10 MB; ein Dialog kann mehrere Fotos tragen.
    client_max_body_size 60m;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        # Überschreibt, was der Absender mitschickt. Die Anwendung traut nur diesem Wert (F-137).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
