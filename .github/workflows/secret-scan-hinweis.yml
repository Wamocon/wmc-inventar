# Hinweis-Pull-Request nach einem Secret-Fund
#
# Wenn der Workflow "Secret Scan" auf dem Standard-Branch fehlschlägt (Push oder manueller Start), legt dieser
# Workflow einen Branch an, schreibt eine Hinweisdatei mit der bereinigten Fundliste und eröffnet daraus einen
# Pull Request. Ein Mensch prüft und gibt frei. Das Team aus der Variable SECRET_HINWEIS_REVIEWER wird als
# Reviewer angefragt, GitHub schickt die E-Mail an die Mitglieder (nach deren Benachrichtigungseinstellungen).
#
# Was dieser Workflow NICHT tut
#   Er ändert keinen Code und entfernt keine Secrets. Ein Schlüssel im Code wird durch keinen automatischen Fix
#   sicher, er muss beim Dienst erneuert werden. Der Pull Request enthält deshalb nur die Fundstellen (ohne Wert)
#   und die Checkliste "erst erneuern, dann bereinigen". Ablauf im Detail: docs/SECRET_GEFUNDEN.md.
#   Der wöchentliche Lauf (schedule) erzeugt bewusst keinen Pull Request, sonst käme jede Woche derselbe Hinweis.
#
# Schalter und Einstellungen (Repository- oder Organisationsvariablen, keine Zugangsdaten nötig)
#   SECRET_HINWEIS_PR        "true" schaltet diesen Workflow ein. Ohne die Variable passiert nichts.
#   SECRET_HINWEIS_REVIEWER  Team oder Benutzer als Reviewer, zum Beispiel Wamocon/alle (Team der Organisation).
#                            Fehlt die Variable oder schlägt die Anfrage fehl, entsteht der Pull Request ohne Reviewer.
#   Voraussetzung: Einstellung "Allow GitHub Actions to create and approve pull requests" ist eingeschaltet
#   (Organisation oder Repository, Settings > Actions > General). Das stellt ein Owner ein.
#
# Warum der Scan auf dem Branch noch einmal gestartet wird
#   Pull Requests, die mit dem Workflow-Token entstehen, lösen keine weiteren Workflows aus. Damit die Pflichtprüfung
#   "gitleaks" im Pull Request trotzdem erscheint, startet dieser Workflow den Secret Scan auf dem Hinweis-Branch
#   und prüft dabei nur die Änderungen gegenüber dem Standard-Branch (Eingabe nur_aenderungen).
#
# Sicherheit: Der Workflow läuft im Kontext des Standard-Branches, nutzt keinen Code aus Pull Requests und gibt
# Werte aus Ereignisdaten nur über Umgebungsvariablen weiter. Dateinamen in der Fundliste werden bereinigt.

name: Secret Scan Hinweis

on:
  workflow_run:
    workflows: ["Secret Scan"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: secret-scan-hinweis-${{ github.event.workflow_run.head_repository.full_name }}
  cancel-in-progress: false

jobs:
  hinweis:
    name: hinweis-pull-request
    if: >-
      ${{ vars.SECRET_HINWEIS_PR == 'true'
      && github.event.workflow_run.conclusion == 'failure'
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
      && github.event.workflow_run.head_branch == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      STANDARD_BRANCH: ${{ github.event.repository.default_branch }}
      SCAN_RUN_ID: ${{ github.event.workflow_run.id }}
      SCAN_RUN_URL: ${{ github.event.workflow_run.html_url }}
      SCAN_EREIGNIS: ${{ github.event.workflow_run.event }}
      REPO_PRIVAT: ${{ github.event.repository.private }}
      REVIEWER: ${{ vars.SECRET_HINWEIS_REVIEWER }}
      HINWEIS_BRANCH: sicherheit/secret-scan-hinweis
    steps:
      - name: Standard-Branch auschecken
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: true

      - name: Fundliste des Scans holen
        uses: actions/download-artifact@v4
        with:
          name: secret-scan-funde
          path: ${{ runner.temp }}/funde
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Hinweisdatei und Pull-Request-Text schreiben
        run: |
          set -euo pipefail
          liste="${RUNNER_TEMP}/funde/funde.json"
          [ -s "${liste}" ] || { echo "Keine Fundliste im Artefakt, Abbruch."; exit 1; }
          anzahl="$(jq length "${liste}")"
          datum="$(date -u +%Y-%m-%d)"

          mkdir -p docs
          {
            echo "# Secret Scan: Hinweis vom ${datum}"
            echo
            echo "Der Secret Scan (gitleaks) hat im Lauf ${SCAN_RUN_URL} ${anzahl} Fundstellen gemeldet. Diese Datei enthält keine Werte."
            echo
            echo "## Checkliste"
            echo
            echo "- [ ] Jeder Fund ist als echt oder als Fehlalarm eingestuft (Fehlalarme per Pull Request in .gitleaks.toml eintragen)."
            echo "- [ ] Bei echten Funden: Schlüssel oder Passwort beim Dienst **zuerst erneuert oder gesperrt**."
            echo "- [ ] Nutzung des alten Werts in den Protokollen des Dienstes geprüft."
            echo "- [ ] Stelle im Code durch eine Umgebungsvariable ersetzt (eigener Pull Request)."
            echo "- [ ] Risikoregister und Jira-Ticket ergänzt."
            echo
            echo "Ablauf im Detail: docs/SECRET_GEFUNDEN.md"
            echo
            if [ "${REPO_PRIVAT}" = "true" ]; then
              echo "## Fundstellen"
              echo
              echo "| Regel | Datei | Zeile | Commit |"
              echo "| --- | --- | --- | --- |"
              jq -r '.[] | "| \(.regel) | `\(.datei | gsub("[`|\\n\\r]"; "_"))` | \(.zeile) | \(.commit) |"' "${liste}"
            else
              echo "## Fundstellen"
              echo
              echo "Das Repository ist öffentlich, deshalb stehen die Fundstellen hier nicht. Sie stehen im Protokoll des Scan-Laufs (Link oben)."
            fi
          } > docs/SECRET_SCAN_HINWEIS.md

          {
            echo "Der Secret Scan hat ${anzahl} Fundstellen gemeldet. Details und Checkliste stehen in docs/SECRET_SCAN_HINWEIS.md."
            echo
            echo "**Dieser Pull Request ändert keinen Code und löst kein Secret.** Zuerst den Schlüssel beim Dienst erneuern, dann aufräumen."
            echo "Zum Schließen: Checkliste abarbeiten, danach mergen oder schließen."
            echo
            echo "Scan-Lauf: ${SCAN_RUN_URL}"
          } > "${RUNNER_TEMP}/pr-text.md"

      - name: Branch anlegen und Datei einchecken
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${HINWEIS_BRANCH}"
          git add docs/SECRET_SCAN_HINWEIS.md
          if git diff --cached --quiet; then
            echo "Hinweisdatei unverändert, kein neuer Commit."
          else
            git commit -m "Secret Scan: Hinweis zu den Fundstellen"
          fi
          git push --force origin "HEAD:refs/heads/${HINWEIS_BRANCH}"

      - name: Pull Request anlegen oder aktualisieren
        run: |
          set -euo pipefail
          offen="$(gh pr list --repo "${REPO}" --head "${HINWEIS_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${offen}" ]; then
            gh pr edit "${offen}" --repo "${REPO}" --body-file "${RUNNER_TEMP}/pr-text.md"
            echo "Pull Request ${offen} aktualisiert."
            nummer="${offen}"
          else
            url="$(gh pr create --repo "${REPO}" --base "${STANDARD_BRANCH}" --head "${HINWEIS_BRANCH}" \
              --title "Secret Scan: Funde prüfen und Schlüssel erneuern" --body-file "${RUNNER_TEMP}/pr-text.md")"
            echo "Pull Request angelegt: ${url}"
            nummer="${url##*/}"
          fi
          if [ -n "${REVIEWER}" ]; then
            gh pr edit "${nummer}" --repo "${REPO}" --add-reviewer "${REVIEWER}" \
              || echo "::warning::Reviewer ${REVIEWER} konnte nicht angefragt werden (Team vorhanden und mit Zugriff auf das Repository?)."
          else
            echo "::notice::Variable SECRET_HINWEIS_REVIEWER ist nicht gesetzt, der Pull Request hat keinen Reviewer."
          fi

      - name: Scan auf dem Hinweis-Branch starten, damit die Pflichtprüfung erscheint
        run: |
          set -euo pipefail
          gh workflow run secret-scan.yml --repo "${REPO}" --ref "${HINWEIS_BRANCH}" -f nur_aenderungen=true
